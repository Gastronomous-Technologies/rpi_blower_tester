[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blower_tester"
version = "05.2026"

dependencies = [
    "pytest",
    "gpiozero",
    "smbus2",
    "rpi.lgpio",
    "pyudev",
    "pyftdi",
    "spidev"
]

requires-python = ">=3.0"

authors = [
  {name = "Dann Demetre", email = "dann.demetre@gastronomous.ca"},
]

maintainers = [
  {name = "Shaqeeb Momen", email = "shaqeeb.momen@gastronomous.ca"}
]

description = "Blower/Thermocouple Testing Application (CG6-CHAS-E-019 V1.5+)"

[tool.hatch.build.targets.wheel]
packages = ["blower_tester/"]

[project.urls]
Repository = "https://github.com/Gastronomous-Technologies/rpi_blower_tester.git"
